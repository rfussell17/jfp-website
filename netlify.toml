[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# Serve the questions page at /faq
[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

# Serve the testimonials page at /testimonials
[[redirects]]
  from = "/testimonials"
  to = "/testimonials.html"
  status = 200
